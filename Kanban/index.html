<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <div class="dropdown">
        <button class="dropbtn"> Legenda </button>
        <div class="dropdown-content">

            <p><span class="color-box  baixa"></span> Prioridade Baixa </p>

            <p><span class="color-box medio"></span> Prioridade Média </p>

            <p><span class="color-box alta"></span> Prioridade Alta </p>

            <p><span class="color-box cancelado"></span> Cancelado </p>

        </div>
    </div>



    <div class="container">
        <div class="note-form">
            <input type="text" id="note-title" placeholder="Título da Nota">
            <div id="note-description" contenteditable="true" class="editable" data-placeholder="Descrição da Nota">
            </div>
            <select name="Cor" id="note-color" aria-label="Cor">
                <option value="#2579e7e0"> Azul </option>
                <option value="#1da701"> Verde </option>
                <option value="#ff7402"> Laranja </option>
                <option value="#e40b0b"> Vermelho</option>
            </select>


            <button id="add-note-btn">Adicionar Nota</button>
        </div>

        <div class="kanban">
            <div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
                <h3>A Fazer</h3>
            </div>

            <div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
                <h3>Em Progresso</h3>
            </div>

            <div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
                <h3>Atraso</h3>
            </div>

            <div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
                <h3>Concluído</h3>
            </div>

        </div>
    </div>
    <script src="func.js"></script>
</body>

</html>
